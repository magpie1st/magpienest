<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>LLM Enabled Translation</title>
    <link rel="stylesheet" href="{{ url_for('static', path='style.css') }}" />
  </head>
  <body>
    <header>
      <h1>LLM 번역기</h1>
      <p class="subtitle">Jetson 기반 Ollama 모델을 이용해 영어 텍스트를 한국어로 번역합니다.</p>
    </header>

    <main>
      <section class="settings">
        <h2>Jetson 연결 설정</h2>
        <div class="form-grid">
          <label for="hostInput">호스트</label>
          <input id="hostInput" type="text" value="{{ default_host }}" placeholder="예: 192.168.55.1" />

          <label for="portInput">포트</label>
          <input id="portInput" type="number" min="1" max="65535" value="{{ default_port }}" placeholder="예: 11434" />

          <label for="timeoutInput">Timeout (sec)</label>
          <input
            id="timeoutInput"
            type="number"
            min="10"
            max="600"
            value="{{ default_timeout }}"
            placeholder="예: 120"
          />
        </div>
        <div class="settings-actions">
          <button id="saveConfigBtn" type="button">기본값 저장</button>
          <button id="testConnectionBtn" type="button">연결 확인</button>
        </div>
      </section>

      <section class="translator">
        <div class="toolbar">
          <label for="modelSelect">번역 모델</label>
          <select id="modelSelect">
            {% for model in models %}
            <option value="{{ model }}">{{ model }}</option>
            {% endfor %}
          </select>

          <label for="temperatureInput">Temperature</label>
          <input
            id="temperatureInput"
            type="number"
            step="0.1"
            min="0"
            max="2"
            value="{{ default_temperature }}"
            title="샘플링 온도 (0은 결정적 출력)"
          />

          <label class="checkbox" title="스트리밍 응답 사용">
            <input id="streamCheckbox" type="checkbox" {% if default_stream %}checked{% endif %} />
            <span>Stream</span>
          </label>

          <label class="checkbox" title="청크 진행률 표시">
            <input id="progressCheckbox" type="checkbox" {% if default_progress %}checked{% endif %} />
            <span>Progress</span>
          </label>

          <label class="checkbox" title="청크 번역을 받을 때마다 출력">
            <input id="liveTextCheckbox" type="checkbox" {% if default_live_text %}checked{% endif %} />
            <span>Live Output</span>
          </label>

          <label class="checkbox" title="<think>...</think> 메타 정보를 제거">
            <input id="stripThinkCheckbox" type="checkbox" {% if default_strip_think %}checked{% endif %} />
            <span>Strip &lt;think&gt;</span>
          </label>

          <button id="translateBtn" type="button">번역 실행</button>
          <button id="stopBtn" type="button" disabled>정지</button>
          <button id="clearBtn" type="button">초기화</button>
        </div>

        <div class="prompt-config">
          <label for="promptTemplate">프롬프트 템플릿</label>
          <textarea
            id="promptTemplate"
            rows="4"
            placeholder="{source} 자리에 입력 텍스트가 삽입됩니다."
          >{{ default_prompt }}</textarea>
          <p class="hint">템플릿에 <code>{source}</code>가 포함되어 있으면 해당 위치에 입력한 영어 문장이 들어갑니다.</p>
        </div>

        <div class="advanced-options">
          <div class="field">
            <label for="maxTokensInput">Chunk Max Tokens</label>
            <input
              id="maxTokensInput"
              type="number"
              min="128"
              max="6000"
              value="{{ default_max_tokens }}"
              title="문장 묶음을 보낼 때 최대 토큰 수"
            />
          </div>
          <div class="field">
            <label for="maxSentencesInput">Chunk Max Sentences</label>
            <input
              id="maxSentencesInput"
              type="number"
              min="1"
              max="20"
              value="{{ default_max_sentences }}"
              title="한 번에 번역 요청할 최대 문장 수"
            />
          </div>
          <div class="field">
            <label for="retryAttemptsInput">Retry Attempts</label>
            <input
              id="retryAttemptsInput"
              type="number"
              min="0"
              max="5"
              value="{{ default_retry_attempts }}"
              title="출력이 깨졌을 때 재시도 횟수"
            />
          </div>
        </div>

        <div class="panes">
          <div class="pane">
            <h3>영어 텍스트</h3>
            <textarea id="sourceText" placeholder="번역할 영어 문장을 입력하세요."></textarea>
          </div>
          <div class="pane">
            <h3>한국어 번역</h3>
            <textarea id="translatedText" readonly placeholder="번역 결과가 여기에 표시됩니다."></textarea>
          </div>
        </div>
      </section>

      <section class="tts" id="ttsSection">
        <h2>영어 원문 낭독 (Coqui XTTS v2)</h2>
        <p class="hint">원문 영어 텍스트를 Coqui XTTS v2 모델로 낭독합니다. 기본 언어, 화자, FFmpeg 경로 등을 원하는 값으로 설정할 수 있습니다.</p>

        <div class="tts-settings">
          <h3>낭독 기본 설정</h3>
          <div class="form-grid compact">
            <label for="ttsFfmpegPath">FFmpeg 경로</label>
            <input id="ttsFfmpegPath" type="text" placeholder="예: /usr/bin/ffmpeg" />

            <label for="ttsOutputDir">출력 폴더</label>
            <input id="ttsOutputDir" type="text" placeholder="예: ~/LLMTTS/audio" />

            <label for="ttsDefaultSpeaker">기본 Speaker</label>
            <select id="ttsDefaultSpeaker"></select>

            <label for="ttsDefaultLanguage">기본 언어</label>
            <input id="ttsDefaultLanguage" type="text" value="en" />

            <label for="ttsUseCuda">GPU 사용</label>
            <input id="ttsUseCuda" type="checkbox" />
          </div>
          <div class="tts-settings-actions">
            <button id="ttsSaveSettingsBtn" type="button">설정 저장</button>
            <button id="ttsReloadSpeakersBtn" type="button">화자 목록 새로고침</button>
          </div>
        </div>

        <div class="tts-controls">
          <div class="tts-run-form">
            <div class="form-grid compact">
              <label for="ttsSpeakerSelect">사용할 Speaker</label>
              <div class="speaker-select">
                <select id="ttsSpeakerSelect"></select>
                <input id="ttsSpeakerCustom" type="text" placeholder="직접 입력 (선택 사항)" />
              </div>

              <label for="ttsSpeakerWav">Speaker WAV</label>
              <input id="ttsSpeakerWav" type="text" placeholder="화자 WAV 경로 (선택 사항)" />

              <label for="ttsLanguage">언어</label>
              <input id="ttsLanguage" type="text" placeholder="예: en" />

              <label for="ttsSaveOutput">MP3 저장</label>
              <div class="save-output">
                <input id="ttsSaveOutput" type="checkbox" />
                <input id="ttsFileName" type="text" placeholder="파일명 (미입력 시 자동 지정)" disabled />
              </div>
            </div>
            <div class="tts-run-actions">
              <button id="ttsSpeakBtn" type="button">낭독 실행</button>
              <button id="ttsStopBtn" type="button" disabled>정지</button>
              <button id="ttsSaveBtn" type="button" disabled>다운로드</button>
            </div>
          </div>
        </div>

        <div class="tts-status" id="ttsStatusPanel" hidden>
          <p id="ttsStatusMessage"></p>
          <div class="progress" id="ttsProgressWrapper" hidden>
            <div class="progress-bar">
              <div id="ttsProgressFill" class="progress-fill"></div>
            </div>
            <span id="ttsProgressLabel">0%</span>
          </div>
        </div>

        <div class="tts-audio-preview" id="ttsAudioPreview" hidden>
          <canvas id="ttsWaveform" height="90"></canvas>
          <audio id="ttsAudio" controls></audio>
        </div>
      </section>

      <section class="status" id="statusPanel" hidden>
        <p id="statusMessage"></p>
        <div id="progressWrapper" class="progress" hidden>
          <div class="progress-bar">
            <div id="progressFill" class="progress-fill"></div>
          </div>
          <span id="progressLabel">0%</span>
        </div>
      </section>
    </main>

    <script>
      const defaultState = {
        host: "{{ default_host }}",
        port: {{ default_port }},
        models: {{ models | tojson }},
        promptTemplate: {{ default_prompt | tojson }},
        temperature: {{ default_temperature }},
        stream: {{ 'true' if default_stream else 'false' }},
        maxTokens: {{ default_max_tokens }},
        maxSentences: {{ default_max_sentences }},
        retryAttempts: {{ default_retry_attempts }},
        timeout: {{ default_timeout }},
        progress: {{ 'true' if default_progress else 'false' }},
        liveText: {{ 'true' if default_live_text else 'false' }},
        stripThink: {{ 'true' if default_strip_think else 'false' }},
      };

      const hostInput = document.getElementById("hostInput");
      const portInput = document.getElementById("portInput");
      const timeoutInput = document.getElementById("timeoutInput");
      const modelSelect = document.getElementById("modelSelect");
      const translateBtn = document.getElementById("translateBtn");
      const stopBtn = document.getElementById("stopBtn");
      const clearBtn = document.getElementById("clearBtn");
      const saveConfigBtn = document.getElementById("saveConfigBtn");
      const testConnectionBtn = document.getElementById("testConnectionBtn");
      const promptTemplateInput = document.getElementById("promptTemplate");
      const temperatureInput = document.getElementById("temperatureInput");
      const streamCheckbox = document.getElementById("streamCheckbox");
      const sourceText = document.getElementById("sourceText");
      const translatedText = document.getElementById("translatedText");
      const statusPanel = document.getElementById("statusPanel");
      const statusMessage = document.getElementById("statusMessage");
      const maxTokensInput = document.getElementById("maxTokensInput");
      const maxSentencesInput = document.getElementById("maxSentencesInput");
      const retryAttemptsInput = document.getElementById("retryAttemptsInput");
      const progressCheckbox = document.getElementById("progressCheckbox");
      const liveTextCheckbox = document.getElementById("liveTextCheckbox");
      const stripThinkCheckbox = document.getElementById("stripThinkCheckbox");
      const progressWrapper = document.getElementById("progressWrapper");
      const progressFill = document.getElementById("progressFill");
      const progressLabel = document.getElementById("progressLabel");

      const ttsSpeakBtn = document.getElementById("ttsSpeakBtn");
      const ttsStopBtn = document.getElementById("ttsStopBtn");
      const ttsSaveBtn = document.getElementById("ttsSaveBtn");
      const ttsFfmpegPathInput = document.getElementById("ttsFfmpegPath");
      const ttsOutputDirInput = document.getElementById("ttsOutputDir");
      const ttsDefaultSpeakerSelect = document.getElementById("ttsDefaultSpeaker");
      const ttsDefaultLanguageInput = document.getElementById("ttsDefaultLanguage");
      const ttsUseCudaCheckbox = document.getElementById("ttsUseCuda");
      const ttsSaveSettingsBtn = document.getElementById("ttsSaveSettingsBtn");
      const ttsReloadSpeakersBtn = document.getElementById("ttsReloadSpeakersBtn");
      const ttsSpeakerSelect = document.getElementById("ttsSpeakerSelect");
      const ttsSpeakerCustomInput = document.getElementById("ttsSpeakerCustom");
      const ttsSpeakerWavInput = document.getElementById("ttsSpeakerWav");
      const ttsLanguageInput = document.getElementById("ttsLanguage");
      const ttsSaveOutputCheckbox = document.getElementById("ttsSaveOutput");
      const ttsFileNameInput = document.getElementById("ttsFileName");
      const ttsStatusPanel = document.getElementById("ttsStatusPanel");
      const ttsStatusMessage = document.getElementById("ttsStatusMessage");
      const ttsProgressWrapper = document.getElementById("ttsProgressWrapper");
      const ttsProgressFill = document.getElementById("ttsProgressFill");
      const ttsProgressLabel = document.getElementById("ttsProgressLabel");
      const ttsAudioPreview = document.getElementById("ttsAudioPreview");
      const ttsAudio = document.getElementById("ttsAudio");
      const ttsWaveformCanvas = document.getElementById("ttsWaveform");
      const ttsWaveformCtx = ttsWaveformCanvas.getContext("2d");

      let currentController = null;
      let currentTtsController = null;
      let lastTtsBlob = null;
      let lastTtsUrl = null;
      let waveformData = null;
      let availableSpeakers = [];

      const DEFAULT_SPEAKER_WAV = "/home/magpie/Workspace/dev/macGitHub/magpienest/audiobook/my_reader.wav";
      const DEFAULT_FFMPEG_PATH = "/usr/bin/ffmpeg";
      const DEFAULT_SPEAKER_NAME = "english_female_0";
      const DEFAULT_LANGUAGE_CODE = "en";
      const DEFAULT_OUTPUT_DIR_PATH = "/home/magpie/LLMTTS/audio";

      modelSelect.addEventListener("change", () => {
        console.log("[UI] Model changed", { value: modelSelect.value });
      });

      async function loadTtsSettings(showStatusMessage = false) {
        try {
          const res = await fetch("/api/tts/settings");
          const data = await res.json();
          if (!res.ok) {
            throw new Error(data.detail || "TTS 설정을 불러오지 못했습니다.");
          }
          console.log("[UI] Loaded TTS settings", data);

          ttsFfmpegPathInput.value = data.ffmpeg_path || DEFAULT_FFMPEG_PATH;
          ttsOutputDirInput.value = data.output_dir || DEFAULT_OUTPUT_DIR_PATH;
          ttsDefaultLanguageInput.value = data.default_language || DEFAULT_LANGUAGE_CODE;
          if (!ttsLanguageInput.value) {
            ttsLanguageInput.value = data.default_language || DEFAULT_LANGUAGE_CODE;
          }
          ttsLanguageInput.placeholder = data.default_language || DEFAULT_LANGUAGE_CODE;
          ttsUseCudaCheckbox.checked = Boolean(data.use_cuda);

          availableSpeakers = Array.isArray(data.available_speakers) ? data.available_speakers : [];
          const resolvedDefaultSpeaker = data.default_speaker || DEFAULT_SPEAKER_NAME;
          populateSpeakerSelects(availableSpeakers, resolvedDefaultSpeaker);
          if (availableSpeakers.length === 0 && resolvedDefaultSpeaker) {
            ttsSpeakerCustomInput.value = resolvedDefaultSpeaker;
          }

          if (!ttsSpeakerWavInput.value) {
            ttsSpeakerWavInput.value = DEFAULT_SPEAKER_WAV;
          }
          if (!ttsFfmpegPathInput.value) {
            ttsFfmpegPathInput.value = DEFAULT_FFMPEG_PATH;
          }
          if (!ttsOutputDirInput.value) {
            ttsOutputDirInput.value = DEFAULT_OUTPUT_DIR_PATH;
          }

          ttsSaveOutputCheckbox.dispatchEvent(new Event("change"));

          if (showStatusMessage) {
            showTtsStatus("TTS 설정을 갱신했습니다.");
          }
        } catch (error) {
          console.error("Failed to load TTS settings", error);
          if (showStatusMessage) {
            showTtsStatus((error && error.message) || "TTS 설정을 불러오지 못했습니다.", true);
          }
        }
      }

      async function saveTtsSettings() {
        try {
          const payload = {
            ffmpeg_path: ttsFfmpegPathInput.value.trim() || null,
            output_dir: ttsOutputDirInput.value.trim() || null,
            default_language: ttsDefaultLanguageInput.value.trim() || null,
            default_speaker: ttsDefaultSpeakerSelect.value || null,
            use_cuda: ttsUseCudaCheckbox.checked,
          };

          console.log("[UI] Saving TTS settings", payload);

          const res = await fetch("/api/tts/settings", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload),
          });
          const data = await res.json();
          if (!res.ok) {
            throw new Error(data.detail || "TTS 설정을 저장하지 못했습니다.");
          }

          ttsFfmpegPathInput.value = data.ffmpeg_path || DEFAULT_FFMPEG_PATH;
          ttsOutputDirInput.value = data.output_dir || DEFAULT_OUTPUT_DIR_PATH;
          ttsDefaultLanguageInput.value = data.default_language || DEFAULT_LANGUAGE_CODE;
          ttsLanguageInput.placeholder = data.default_language || DEFAULT_LANGUAGE_CODE;
          if (!ttsLanguageInput.value) {
            ttsLanguageInput.value = data.default_language || DEFAULT_LANGUAGE_CODE;
          }
          ttsUseCudaCheckbox.checked = Boolean(data.use_cuda);

          availableSpeakers = Array.isArray(data.available_speakers) ? data.available_speakers : [];
          const resolvedDefaultSpeaker = data.default_speaker || DEFAULT_SPEAKER_NAME;
          populateSpeakerSelects(availableSpeakers, resolvedDefaultSpeaker);
          if (availableSpeakers.length === 0 && resolvedDefaultSpeaker) {
            ttsSpeakerCustomInput.value = resolvedDefaultSpeaker;
          }

          if (!ttsSpeakerWavInput.value) {
            ttsSpeakerWavInput.value = DEFAULT_SPEAKER_WAV;
          }
          if (!ttsFfmpegPathInput.value) {
            ttsFfmpegPathInput.value = DEFAULT_FFMPEG_PATH;
          }
          if (!ttsOutputDirInput.value) {
            ttsOutputDirInput.value = DEFAULT_OUTPUT_DIR_PATH;
          }

          ttsSaveOutputCheckbox.dispatchEvent(new Event("change"));
          showTtsStatus("TTS 설정을 저장했습니다.");
        } catch (error) {
          console.error("[UI] Failed to save TTS settings", error);
          showTtsStatus((error && error.message) || "TTS 설정 저장에 실패했습니다.", true);
        }
      }

      function populateSpeakerSelects(speakers, defaultSpeaker) {
        const options = [""].concat(speakers || []);
        const selected = defaultSpeaker || "";
        const hasSelected = options.includes(selected);
        setSelectOptions(ttsDefaultSpeakerSelect, options, hasSelected ? selected : "");
        if (!hasSelected && selected) {
          ttsDefaultSpeakerSelect.value = "";
          ttsSpeakerCustomInput.value = selected;
        }

        const shouldUseList = !ttsSpeakerCustomInput.value.trim() && hasSelected;
        setSelectOptions(ttsSpeakerSelect, options, shouldUseList ? selected : "");
      }

      function setSelectOptions(selectElem, options, selectedValue) {
        const previous = selectedValue ?? selectElem.value;
        selectElem.innerHTML = "";
        options.forEach((value) => {
          const opt = document.createElement("option");
          opt.value = value;
          opt.textContent = value || "(자동 선택)";
          if (value === previous) {
            opt.selected = true;
          }
          selectElem.appendChild(opt);
        });
      }

      function showStatus(message, isError = false, isLoading = false) {
        statusMessage.textContent = message;
        statusPanel.hidden = false;
        statusPanel.classList.toggle("error", isError);
        statusPanel.classList.toggle("loading", isLoading);
        if (!message) {
          statusPanel.hidden = true;
        }
      }

      function resetProgress() {
        progressWrapper.hidden = true;
        progressFill.style.width = "0%";
        progressLabel.textContent = "0%";
      }

      function updateProgress(percent) {
        progressWrapper.hidden = false;
        const clamped = Math.max(0, Math.min(100, percent));
        progressFill.style.width = `${clamped}%`;
        progressLabel.textContent = `${clamped}%`;
      }

      function showTtsStatus(message, isError = false, isLoading = false) {
        ttsStatusMessage.textContent = message;
        ttsStatusPanel.hidden = false;
        ttsStatusPanel.classList.toggle("error", isError);
        ttsStatusPanel.classList.toggle("loading", isLoading);
        if (!message) {
          ttsStatusPanel.hidden = true;
          ttsStatusPanel.classList.remove("error", "loading");
        }
      }

      function resetTtsProgress() {
        ttsProgressWrapper.hidden = true;
        ttsProgressFill.style.width = "0%";
        ttsProgressLabel.textContent = "0%";
      }

      function updateTtsProgress(percent) {
        ttsProgressWrapper.hidden = false;
        const clamped = Math.max(0, Math.min(100, percent));
        ttsProgressFill.style.width = `${clamped}%`;
        ttsProgressLabel.textContent = `${clamped}%`;
      }

      function applyTtsAudio(blob) {
        if (lastTtsUrl) {
          URL.revokeObjectURL(lastTtsUrl);
          lastTtsUrl = null;
        }
        lastTtsBlob = blob || null;
        waveformData = null;
        if (!blob) {
          ttsAudio.pause();
          ttsAudio.src = "";
          ttsAudioPreview.hidden = true;
          ttsSaveBtn.disabled = true;
          ttsSaveBtn.title = "다운로드";
          drawWaveform();
          return;
        }
        lastTtsUrl = URL.createObjectURL(blob);
        ttsAudio.src = lastTtsUrl;
        ttsAudioPreview.hidden = false;
        ttsSaveBtn.disabled = false;
        renderWaveformFromBlob(blob);
      }

      function clearTtsAudio() {
        applyTtsAudio(null);
      }

      async function renderWaveformFromBlob(blob) {
        let audioContext;
        try {
          audioContext = new (window.AudioContext || window.webkitAudioContext)();
          const arrayBuffer = await blob.arrayBuffer();
          const audioBuffer = await audioContext.decodeAudioData(arrayBuffer.slice(0));
          const channelData = audioBuffer.getChannelData(0);
          const samplePoints = Math.min(channelData.length, 2000);
          const step = Math.floor(channelData.length / samplePoints) || 1;
          const samples = new Float32Array(samplePoints);
          for (let i = 0; i < samplePoints; i += 1) {
            const start = i * step;
            const end = Math.min(start + step, channelData.length);
            let sum = 0;
            for (let j = start; j < end; j += 1) {
              sum += Math.abs(channelData[j]);
            }
            samples[i] = sum / (end - start || 1);
          }
          waveformData = {
            samples,
            duration: audioBuffer.duration,
          };
          drawWaveform(0);
          await audioContext.close();
        } catch (error) {
          console.warn("Failed to render waveform", error);
          waveformData = null;
          drawWaveform();
          if (audioContext) {
            try {
              await audioContext.close();
            } catch (closeErr) {
              console.warn("Failed to close AudioContext", closeErr);
            }
          }
        }
      }

      function drawWaveform(progressFraction = null) {
        if (!ttsWaveformCtx) {
          return;
        }
        const width = ttsWaveformCanvas.clientWidth || 640;
        if (ttsWaveformCanvas.width !== width) {
          ttsWaveformCanvas.width = width;
        }
        const height = ttsWaveformCanvas.height;
        ttsWaveformCtx.clearRect(0, 0, width, height);
        ttsWaveformCtx.fillStyle = "rgba(148,163,184,0.2)";
        ttsWaveformCtx.fillRect(0, 0, width, height);

        if (waveformData && waveformData.samples.length > 0) {
          const samples = waveformData.samples;
          const step = width / samples.length;
          ttsWaveformCtx.fillStyle = "rgba(37,99,235,0.6)";
          for (let i = 0; i < samples.length; i += 1) {
            const x = Math.floor(i * step);
            const amp = samples[i];
            const h = Math.max(1, Math.min(amp * height * 1.8, height));
            const y = Math.floor((height - h) / 2);
            ttsWaveformCtx.fillRect(x, y, Math.ceil(step), h);
          }
        }

        if (progressFraction !== null && waveformData && waveformData.duration > 0) {
          const clamped = Math.max(0, Math.min(1, progressFraction));
          const x = Math.floor(clamped * width);
          ttsWaveformCtx.fillStyle = "rgba(220,38,38,0.8)";
          ttsWaveformCtx.fillRect(x, 0, 2, height);
        }
      }

      function parsePort(value) {
        const num = Number.parseInt(value, 10);
        return Number.isNaN(num) ? undefined : num;
      }

      function parseTimeout(value) {
        const num = Number.parseInt(value, 10);
        return Number.isNaN(num) ? undefined : num;
      }

      function parseTemperature(value) {
        if (value === "" || value === undefined) {
          return undefined;
        }
        const parsed = Number.parseFloat(value);
        return Number.isNaN(parsed) ? undefined : parsed;
      }

      function replaceModelOptions(models) {
        const previous = modelSelect.value;
        modelSelect.innerHTML = "";
        models.forEach((model) => {
          const opt = document.createElement("option");
          opt.value = model;
          opt.textContent = model;
          modelSelect.appendChild(opt);
        });
        if (models.includes(previous)) {
          modelSelect.value = previous;
        } else if (models.length > 0) {
          modelSelect.value = models[0];
        }
      }

      saveConfigBtn.addEventListener("click", async () => {
        try {
          console.log("[UI] Save connection config", {
            host: hostInput.value.trim(),
            port: parsePort(portInput.value),
            timeout: parseTimeout(timeoutInput.value),
          });
          const body = {
            host: hostInput.value.trim() || undefined,
            port: parsePort(portInput.value),
            timeout: parseTimeout(timeoutInput.value),
          };
          const res = await fetch("/api/config", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(body),
          });
          if (!res.ok) {
            const data = await res.json();
            throw new Error(data.detail || "설정을 저장하지 못했습니다.");
          }
          const data = await res.json();
          const timeoutInfo = data.timeout ? ` (timeout ${data.timeout}s)` : "";
          showStatus(`기본 연결 정보가 ${data.host}:${data.port}${timeoutInfo} 로 저장되었습니다.`);
        } catch (error) {
          showStatus(error.message || "설정을 저장하지 못했습니다.", true);
        }
      });

      testConnectionBtn.addEventListener("click", async () => {
        showStatus("연결 확인 중...", false, true);
        try {
          console.log("[UI] Connection test requested", {
            host: hostInput.value.trim(),
            port: parsePort(portInput.value),
            timeout: parseTimeout(timeoutInput.value),
          });
          const body = {
            host: hostInput.value.trim() || undefined,
            port: parsePort(portInput.value),
            timeout: parseTimeout(timeoutInput.value),
          };
          const res = await fetch("/api/models", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(body),
          });
          const data = await res.json();
          console.log("[UI] Connection test response", { ok: res.ok, models: data.models });
          if (!res.ok) {
            throw new Error(data.detail || "연결에 실패했습니다.");
          }
          if (Array.isArray(data.models) && data.models.length > 0) {
            replaceModelOptions(data.models);
            showStatus(`연결 성공: ${data.models.length}개 모델 확인.`);
          } else {
            showStatus("연결은 되었으나 사용 가능한 모델이 없습니다.", true);
          }
        } catch (error) {
          showStatus(error.message || "연결 확인 중 오류가 발생했습니다.", true);
        }
      });

      translateBtn.addEventListener("click", async () => {
        const text = sourceText.value.trim();
        console.log("[UI] Translate requested", { length: text.length, model: modelSelect.value });
        if (!text) {
          showStatus("영어 텍스트를 입력해 주세요.", true);
          return;
        }
        const model = modelSelect.value;
        if (!model) {
          showStatus("모델을 선택해 주세요.", true);
          return;
        }
        showStatus("번역 중입니다...", false, true);
        translatedText.value = "";
        let controller;
        try {
          if (currentController) {
            currentController.abort();
          }
          controller = new AbortController();
          currentController = controller;
          stopBtn.disabled = false;
          translateBtn.disabled = true;

          const body = {
            text,
            model,
            host: hostInput.value.trim() || undefined,
            port: parsePort(portInput.value),
            prompt_template: promptTemplateInput.value.trim() || undefined,
            stream: streamCheckbox.checked,
            timeout: parseTimeout(timeoutInput.value),
            progress_updates: progressCheckbox.checked,
            live_text: liveTextCheckbox.checked,
            strip_think_tag: stripThinkCheckbox.checked,
          };
          const temperature = parseTemperature(temperatureInput.value);
          if (temperature !== undefined) {
            body.temperature = temperature;
          }
          const maxTokens = parseInt(maxTokensInput.value, 10);
          if (!Number.isNaN(maxTokens)) {
            body.max_tokens_per_chunk = maxTokens;
          }
          const maxSentences = parseInt(maxSentencesInput.value, 10);
          if (!Number.isNaN(maxSentences)) {
            body.max_sentences_per_chunk = maxSentences;
          }
          const retryAttempts = parseInt(retryAttemptsInput.value, 10);
          if (!Number.isNaN(retryAttempts)) {
            body.retry_garbage_attempts = retryAttempts;
          }
          resetProgress();
          console.log("[UI] Translate payload", body);
          const res = await fetch("/api/translate", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(body),
            signal: controller.signal,
          });

          if (progressCheckbox.checked) {
            const supportsStream = res.body && typeof res.body.getReader === "function";
            if (supportsStream) {
              await handleStreamingResponse(res, liveTextCheckbox.checked);
            } else {
              await handleBufferedProgress(res, liveTextCheckbox.checked);
            }
          } else {
            const data = await res.json();
            if (!res.ok) {
              throw new Error(data.detail || "번역에 실패했습니다.");
            }
            translatedText.value = data.translation || "";
            showStatus("번역이 완료되었습니다.");
          }
        } catch (error) {
          console.error("[UI] Translate error", error);
          if (error && error.name === "AbortError") {
            showStatus("번역을 중지했습니다.");
            resetProgress();
          } else {
            translatedText.value = "";
            showStatus((error && error.message) || "번역에 실패했습니다.", true);
          }
        } finally {
          if (currentController === controller) {
            currentController = null;
            stopBtn.disabled = true;
            translateBtn.disabled = false;
          }
        }
      });

      clearBtn.addEventListener("click", () => {
        console.log("[UI] Clear requested");
        sourceText.value = "";
        translatedText.value = "";
        showStatus("", false);
        resetProgress();
        if (currentTtsController) {
          currentTtsController.abort();
          currentTtsController = null;
        }
        clearTtsAudio();
        resetTtsProgress();
        showTtsStatus("", false);
        ttsStopBtn.disabled = true;
        ttsSpeakBtn.disabled = false;
        if (ttsSpeakerSelect.options.length > 0) {
          ttsSpeakerSelect.selectedIndex = 0;
        }
        ttsSpeakerCustomInput.value = "";
        ttsSpeakerWavInput.value = DEFAULT_SPEAKER_WAV;
        ttsLanguageInput.value = DEFAULT_LANGUAGE_CODE;
        ttsSaveOutputCheckbox.checked = false;
        ttsFileNameInput.value = "";
        ttsSaveOutputCheckbox.dispatchEvent(new Event("change"));
      });

      stopBtn.addEventListener("click", () => {
        if (currentController) {
          currentController.abort();
          currentController = null;
          stopBtn.disabled = true;
          translateBtn.disabled = false;
          showStatus("번역 중지를 요청했습니다.");
        }
      });

      ttsSpeakBtn.addEventListener("click", async () => {
        const text = sourceText.value.trim();
        console.log("[UI] TTS speak requested", { length: text.length });
        if (!text) {
          showTtsStatus("영어 텍스트를 입력해 주세요.", true);
          return;
        }

        try {
          if (currentTtsController) {
            currentTtsController.abort();
          }
          const controller = new AbortController();
          currentTtsController = controller;
          ttsSpeakBtn.disabled = true;
          ttsStopBtn.disabled = false;
          ttsSaveBtn.disabled = true;
          showTtsStatus("낭독을 준비 중입니다...", false, true);
          resetTtsProgress();
          clearTtsAudio();

          const userLanguage = ttsLanguageInput.value.trim();
          const language = userLanguage || ttsDefaultLanguageInput.value.trim() || "en";
          const selectedSpeaker = ttsSpeakerSelect.value || "";
          const customSpeaker = ttsSpeakerCustomInput.value.trim();
          const speaker = customSpeaker || selectedSpeaker || undefined;
          const speakerWav = ttsSpeakerWavInput.value.trim() || undefined;
          const saveOutput = ttsSaveOutputCheckbox.checked;
          const fileName = ttsFileNameInput.value.trim() || undefined;

          const payload = {
            text,
            language,
            speaker,
            speaker_wav: speakerWav,
            save_output: saveOutput,
            filename: fileName,
          };
          console.log("[UI] TTS payload", payload);

          const res = await fetch("/api/tts", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload),
            signal: controller.signal,
          });

          const supportsStream = res.body && typeof res.body.getReader === "function";
          if (supportsStream) {
            await handleTtsStreamingResponse(res);
          } else {
            await handleTtsBufferedProgress(res);
          }
        } catch (error) {
          if (error && error.name === "AbortError") {
            showTtsStatus("낭독을 중지했습니다.");
            resetTtsProgress();
          } else {
            console.error("[UI] TTS error", error);
            showTtsStatus((error && error.message) || "낭독에 실패했습니다.", true);
            resetTtsProgress();
            clearTtsAudio();
          }
        } finally {
          if (currentTtsController) {
            currentTtsController = null;
          }
          ttsSpeakBtn.disabled = false;
          ttsStopBtn.disabled = true;
          if (!lastTtsBlob) {
            ttsSaveBtn.disabled = true;
          }
        }
      });

      ttsStopBtn.addEventListener("click", () => {
        if (currentTtsController) {
          currentTtsController.abort();
          currentTtsController = null;
          ttsSpeakBtn.disabled = false;
          ttsStopBtn.disabled = true;
          resetTtsProgress();
          showTtsStatus("낭독을 중지했습니다.");
        }
      });

      ttsSaveBtn.addEventListener("click", () => {
        if (!lastTtsBlob) {
          return;
        }
        if (!lastTtsUrl) {
          lastTtsUrl = URL.createObjectURL(lastTtsBlob);
        }
        const link = document.createElement("a");
        link.href = lastTtsUrl;
        const timestamp = new Date().toISOString().replace(/[:.]/g, "-");
        link.download = `tts-${timestamp}.mp3`;
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
      });

      ttsSaveSettingsBtn.addEventListener("click", () => {
        saveTtsSettings();
      });

      ttsReloadSpeakersBtn.addEventListener("click", () => {
        loadTtsSettings(true);
      });

      ttsDefaultSpeakerSelect.addEventListener("change", () => {
        if (!ttsSpeakerCustomInput.value.trim()) {
          ttsSpeakerSelect.value = ttsDefaultSpeakerSelect.value || "";
        }
      });

      ttsSpeakerSelect.addEventListener("change", () => {
        ttsSpeakerCustomInput.value = "";
      });

      ttsSaveOutputCheckbox.addEventListener("change", () => {
        const enabled = ttsSaveOutputCheckbox.checked;
        ttsFileNameInput.disabled = !enabled;
        if (!enabled) {
          ttsFileNameInput.value = "";
        }
      });
      ttsSpeakerCustomInput.addEventListener("input", () => {
        if (ttsSpeakerCustomInput.value.trim()) {
          ttsSpeakerSelect.value = "";
        }
      });


      ttsAudio.addEventListener("timeupdate", () => {
        if (waveformData && waveformData.duration > 0) {
          drawWaveform(ttsAudio.currentTime / waveformData.duration);
        }
      });

      ttsAudio.addEventListener("play", () => {
        if (waveformData && waveformData.duration > 0) {
          drawWaveform(ttsAudio.currentTime / waveformData.duration);
        }
      });

      ttsAudio.addEventListener("ended", () => {
        if (waveformData && waveformData.duration > 0) {
          drawWaveform(1);
        }
      });

      window.addEventListener("resize", () => {
        if (waveformData && waveformData.duration > 0) {
          const progress = ttsAudio.currentTime / waveformData.duration;
          drawWaveform(progress);
        } else {
          drawWaveform();
        }
      });

      // Initialise state
      replaceModelOptions(defaultState.models);
      showStatus("", false);
      hostInput.value = defaultState.host;
      portInput.value = defaultState.port;
      promptTemplateInput.value = defaultState.promptTemplate || "";
      temperatureInput.value =
        defaultState.temperature !== undefined && defaultState.temperature !== null
          ? defaultState.temperature
          : "";
      streamCheckbox.checked = defaultState.stream === true || defaultState.stream === "true";
      maxTokensInput.value = defaultState.maxTokens;
      maxSentencesInput.value = defaultState.maxSentences;
      retryAttemptsInput.value = defaultState.retryAttempts;
      timeoutInput.value =
        defaultState.timeout !== undefined && defaultState.timeout !== null ? defaultState.timeout : "";
      progressCheckbox.checked = defaultState.progress === true || defaultState.progress === "true";
      liveTextCheckbox.checked = defaultState.liveText === true || defaultState.liveText === "true";
      stripThinkCheckbox.checked = defaultState.stripThink === true || defaultState.stripThink === "true";
      resetProgress();
      stopBtn.disabled = true;
      resetTtsProgress();
      showTtsStatus("", false);
      clearTtsAudio();
      ttsStopBtn.disabled = true;
      ttsSaveBtn.title = "다운로드";
      populateSpeakerSelects([], DEFAULT_SPEAKER_NAME);
      ttsSpeakerWavInput.value = DEFAULT_SPEAKER_WAV;
      ttsLanguageInput.value = DEFAULT_LANGUAGE_CODE;
      loadTtsSettings();

      async function handleStreamingResponse(response, includeText) {
        if (!response.ok || !response.body) {
          const data = await response.json().catch(() => ({ detail: "번역에 실패했습니다." }));
          throw new Error(data.detail || "번역에 실패했습니다.");
        }

        const reader = response.body.getReader();
        const decoder = new TextDecoder("utf-8");
        let buffer = "";
        let aggregatedText = "";

        const flushBuffer = () => {
          let newlineIndex;
          while ((newlineIndex = buffer.indexOf("\n")) >= 0) {
            const line = buffer.slice(0, newlineIndex).trim();
            buffer = buffer.slice(newlineIndex + 1);
            if (!line) {
              continue;
            }
            try {
              const event = JSON.parse(line);
              handleProgressEvent(event, includeText, (text) => {
                aggregatedText = text;
              });
            } catch (err) {
              console.warn("Invalid progress event", err, line);
            }
          }
        };

        while (true) {
          const { value, done } = await reader.read();
          if (done) {
            break;
          }
          buffer += decoder.decode(value, { stream: true });
          flushBuffer();
        }
        buffer += decoder.decode();
        flushBuffer();

        if (!aggregatedText) {
          aggregatedText = translatedText.value;
        }
        translatedText.value = aggregatedText;
        showStatus("번역이 완료되었습니다.");
      }

      async function handleBufferedProgress(response, includeText) {
        const textData = await response.text();
        if (!response.ok) {
          let detail;
          try {
            const parsed = JSON.parse(textData);
            detail = parsed.detail;
          } catch (err) {
            detail = textData || "번역에 실패했습니다.";
          }
          throw new Error(detail || "번역에 실패했습니다.");
        }

        const events = textData
          .split(/\r?\n/)
          .map((line) => line.trim())
          .filter(Boolean)
          .map((line) => {
            try {
              return JSON.parse(line);
            } catch (err) {
              return null;
            }
          })
          .filter(Boolean);

        let aggregatedText = translatedText.value;
        for (const event of events) {
          handleProgressEvent(event, includeText, (text) => {
            aggregatedText = text;
          });
        }

        if (!aggregatedText) {
          aggregatedText = translatedText.value;
        }
        translatedText.value = aggregatedText;
        showStatus("번역이 완료되었습니다.");
      }

      function handleProgressEvent(event, includeText, setAggregated) {
        switch (event.type) {
          case "meta":
            resetProgress();
            showStatus("번역 준비 중...");
            break;
          case "chunk":
            if (typeof event.percent === "number") {
              updateProgress(event.percent);
              showStatus(`번역 진행 중... (${event.percent}%)`, false, event.percent < 100);
            }
            if (includeText && typeof event.text === "string") {
              const current = translatedText.value ? `${translatedText.value}\n\n${event.text}` : event.text;
              translatedText.value = current;
              setAggregated(current);
            }
            break;
          case "done":
            updateProgress(100);
            setAggregated(event.translation || "");
            translatedText.value = event.translation || "";
            showStatus("번역이 완료되었습니다.");
            break;
          case "error":
            resetProgress();
            showStatus(event.message || "번역에 실패했습니다.", true);
            translatedText.value = "";
            break;
        }
      }

      async function handleTtsStreamingResponse(response) {
        if (!response.ok || !response.body) {
          const data = await response.json().catch(() => ({ detail: "낭독에 실패했습니다." }));
          throw new Error(data.detail || "낭독에 실패했습니다.");
        }

        const reader = response.body.getReader();
        const decoder = new TextDecoder("utf-8");
        let buffer = "";

        const flush = () => {
          let newlineIndex;
          while ((newlineIndex = buffer.indexOf("\n")) >= 0) {
            const line = buffer.slice(0, newlineIndex).trim();
            buffer = buffer.slice(newlineIndex + 1);
            if (!line) {
              continue;
            }
            try {
              const event = JSON.parse(line);
              handleTtsProgressEvent(event);
            } catch (err) {
              console.warn("Invalid TTS progress event", err, line);
            }
          }
        };

        while (true) {
          const { value, done } = await reader.read();
          if (done) {
            break;
          }
          buffer += decoder.decode(value, { stream: true });
          flush();
        }
        buffer += decoder.decode();
        flush();
      }

      async function handleTtsBufferedProgress(response) {
        const textData = await response.text();
        if (!response.ok) {
          let detail;
          try {
            const parsed = JSON.parse(textData);
            detail = parsed.detail;
          } catch (err) {
            detail = textData || "낭독에 실패했습니다.";
          }
          throw new Error(detail || "낭독에 실패했습니다.");
        }

        textData
          .split(/\r?\n/)
          .map((line) => line.trim())
          .filter(Boolean)
          .forEach((line) => {
            try {
              const event = JSON.parse(line);
              handleTtsProgressEvent(event);
            } catch (err) {
              console.warn("Invalid TTS progress event", err, line);
            }
          });
      }

      function handleTtsProgressEvent(event) {
        switch (event.type) {
          case "meta":
            showTtsStatus("낭독을 준비 중입니다...", false, true);
            resetTtsProgress();
            break;
          case "progress":
            if (typeof event.percent === "number") {
              updateTtsProgress(event.percent);
            }
            showTtsStatus(event.message || "낭독 중...", false, true);
            break;
        case "done":
          updateTtsProgress(event.percent ?? 100);
          let doneMessage = "낭독이 완료되었습니다.";
          if (event.saved_path) {
            doneMessage = `${doneMessage} 저장 위치: ${event.saved_path}`;
          }
          if (event.speaker) {
            doneMessage = `${doneMessage} (Speaker: ${event.speaker})`;
          }
          showTtsStatus(doneMessage);
          if (event.language) {
            ttsLanguageInput.value = event.language;
          }
          if (event.speaker && !ttsSpeakerCustomInput.value.trim()) {
            if (Array.from(ttsSpeakerSelect.options).some((opt) => opt.value === event.speaker)) {
              ttsSpeakerSelect.value = event.speaker;
            } else {
              ttsSpeakerCustomInput.value = event.speaker;
            }
          }
          if (event.filename && ttsSaveOutputCheckbox.checked) {
            ttsFileNameInput.value = event.filename;
          }
          if (event.saved_path) {
            ttsSaveBtn.title = `다운로드 (저장 위치: ${event.saved_path})`;
+          } else if (event.filename) {
+            ttsSaveBtn.title = `다운로드 (${event.filename})`;
+          } else {
+            ttsSaveBtn.title = "다운로드";
           }
           if (event.audio_base64) {
            const blob = decodeBase64Audio(event.audio_base64, event.mime || "audio/mpeg");
            applyTtsAudio(blob);
          }
          break;
          case "error":
            resetTtsProgress();
            showTtsStatus(event.message || "낭독에 실패했습니다.", true);
            ttsSaveBtn.title = "다운로드";
            applyTtsAudio(null);
            break;
        }
      }

      function decodeBase64Audio(base64, mime) {
        const binary = atob(base64);
        const length = binary.length;
        const bytes = new Uint8Array(length);
        for (let i = 0; i < length; i += 1) {
          bytes[i] = binary.charCodeAt(i);
        }
        return new Blob([bytes], { type: mime || "audio/mpeg" });
      }
    </script>
